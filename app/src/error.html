<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>%sveltekit.status% – Downshit Store</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				box-sizing: border-box;
				background: #fff;
				color: #0a0a0a;
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
				text-align: center;
			}
			.code {
				font-size: clamp(5rem, 22vw, 10rem);
				font-weight: 800;
				line-height: 1;
				letter-spacing: -0.02em;
			}
			.eyebrow {
				font-size: 0.7rem;
				letter-spacing: 0.18em;
				text-transform: uppercase;
				color: #6b6b66;
			}
			p {
				max-width: 28rem;
				margin: 1rem auto 0;
				font-size: 0.9rem;
				line-height: 1.6;
				color: #6b6b66;
			}
			a {
				display: inline-block;
				margin-top: 2rem;
				padding: 0.8rem 1.6rem;
				background: #0a0a0a;
				color: #fff;
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<div>
			<div class="eyebrow">Downshit Store &middot; Kesalahan</div>
			<div class="code">%sveltekit.status%</div>
			<p>%sveltekit.error.message%</p>
			<a href="/">Kembali ke beranda</a>
		</div>
	</body>
</html>
