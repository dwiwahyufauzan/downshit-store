# /etc/nginx/sites-available/downshit  (lalu: ln -s ... /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx)
# Ganti toko.contoh.id. HTTPS: certbot --nginx -d toko.contoh.id --redirect -m emailanda@contoh.com --agree-tos
# CATATAN: berkas ini TIDAK dapat diuji di mesin pengembangan (nginx tidak terpasang); jalankan `nginx -t` di server.

limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;   # login & registrasi (anti brute-force)
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;   # halaman biasa (longgar)
limit_req_status 429;

server {
    listen 80;
    server_name toko.contoh.id;

    client_max_body_size 3m;                 # selaras BODY_SIZE_LIMIT=3M di .env
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # header proxy berlaku untuk semua location di bawah
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # MENIMPA header kiriman klien (anti-spoofing; XFF_DEPTH=1)
    proxy_set_header X-Forwarded-Proto $scheme;

    # pemeliharaan hanya boleh dari localhost (cron memanggil 127.0.0.1:3000 langsung)
    location /internal/ { return 404; }

    # aset build bernama-hash & gambar: TANPA limit_req (satu halaman memuat puluhan berkas).
    # Cache-Control sudah dikirim adapter-node: jangan menambah add_header (header ganda).
    location /_app/immutable/ { proxy_pass http://127.0.0.1:3000; }
    location /uploads/        { proxy_pass http://127.0.0.1:3000; }

    # batasi percobaan login & registrasi
    location ~ ^/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}

# Di belakang Cloudflare? JANGAN menaikkan XFF_DEPTH. Tambahkan di blok server di atas:
#   real_ip_header CF-Connecting-IP;
#   set_real_ip_from <rentang IP Cloudflare>;     # https://www.cloudflare.com/ips/
